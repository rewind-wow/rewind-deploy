[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rewind-map-rebuild"
version = "0.1.0"
description = "Safely rebuild and deploy VMaNGOS map data over SSH"
readme = "tools/map_rebuild/README.md"
requires-python = ">=3.11"
dependencies = [
  "paramiko>=3.4,<4",
]

[project.scripts]
map-rebuild = "map_rebuild.cli:main"

[tool.setuptools.packages.find]
where = ["tools"]
